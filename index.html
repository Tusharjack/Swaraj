<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="IndoProperty - Modern Real Estate Platform. Discover verified properties, watch video reels, connect with top brokers and builders, and send instant enquiries." />
    <meta name="theme-color" content="#ffffff" />
    <title>IndoProperty | Modern Real Estate &amp; Video Reels Platform</title>

    <!-- ── Default Open Graph / Twitter Card tags ────────────────────────── -->
    <!-- These are shown when any page is shared WITHOUT a specific reel.    -->
    <!-- For /reel/:id pages the Netlify Edge Function replaces these with   -->
    <!-- reel-specific values (thumbnail, title, creator) before serving.   -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="IndoProperty" />
    <meta property="og:title"       content="IndoProperty — India's Real Estate &amp; Video Platform" />
    <meta property="og:description" content="Buy, sell, rent properties and watch immersive video reels. Direct chat with brokers, apply for home loans, earn coins." />
    <meta property="og:image"       content="https://indoproperty.in/logo.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url"         content="https://indoproperty.in" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@IndoProperty" />
    <meta name="twitter:title"       content="IndoProperty — India's Real Estate &amp; Video Platform" />
    <meta name="twitter:description" content="Buy, sell, rent properties and watch immersive video reels." />
    <meta name="twitter:image"       content="https://indoproperty.in/logo.png" />

    <!-- WhatsApp uses og:image — ensure it is absolute and ≥300×200 px -->

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
